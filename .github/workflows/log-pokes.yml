name: Log daily pokes

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-pokes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log yesterday's pokes
        env:
          SUPABASE_URL: https://jiosqsebvezruvhnyplv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/log-pokes.mjs

      - name: Commit history when it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/poke-history.json
          if git diff --cached --quiet; then
            echo 'No history changes to commit.'
          else
            git commit -m "Log daily poke count"
            git push origin HEAD:main
          fi